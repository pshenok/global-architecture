syntax = "proto3";

package ga.house.v1;

import "ga/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// HouseService owns rentable houses (listings).
service HouseService {
  // CreateHouse lists a new house owned by the calling user.
  // Access: user.
  // Errors: INVALID_ARGUMENT, FAILED_PRECONDITION (the owner's account is gone),
  // UNAVAILABLE (user-service unreachable), UNAUTHENTICATED, PERMISSION_DENIED.
  rpc CreateHouse(CreateHouseRequest) returns (CreateHouseResponse);
  // GetHouse returns one house.
  // Access: public (world-readable catalogue).
  // Errors: INVALID_ARGUMENT, NOT_FOUND, UNAUTHENTICATED (no caller assertion).
  rpc GetHouse(GetHouseRequest) returns (GetHouseResponse);
  // ListHouses pages through houses, newest first, with optional filters.
  // Access: public (world-readable catalogue).
  // Errors: INVALID_ARGUMENT, UNAUTHENTICATED (no caller assertion).
  rpc ListHouses(ListHousesRequest) returns (ListHousesResponse);
  // UpdateHouse changes only the fields that are set. Owner or admin only.
  // Access: user.
  // Errors: INVALID_ARGUMENT, NOT_FOUND, PERMISSION_DENIED (HOUSE_PERMISSION_DENIED),
  // UNAUTHENTICATED.
  rpc UpdateHouse(UpdateHouseRequest) returns (UpdateHouseResponse);
  // DeleteHouse removes a house. Owner or admin only.
  // Access: user.
  // Errors: INVALID_ARGUMENT, NOT_FOUND, PERMISSION_DENIED (HOUSE_PERMISSION_DENIED),
  // UNAUTHENTICATED.
  rpc DeleteHouse(DeleteHouseRequest) returns (DeleteHouseResponse);
}

// House is a property that guests can book.
message House {
  // Server-generated UUIDv7.
  string id = 1;
  // Id of the owning ga.user.v1.User. Never changes: other services snapshot it
  // (booking-service stores it as the booking's host). A future ownership transfer
  // must publish an event that updates those snapshots (ADR-0002, ADR-0005).
  string owner_id = 2;
  string title = 3;
  string description = 4;
  Address address = 5;
  ga.common.v1.Money nightly_price = 6;
  int32 max_guests = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
}

// Address is a postal address.
message Address {
  string line1 = 1;
  string city = 2;
  // ISO 3166-1 alpha-2, for example "UA" or "US".
  string country_code = 3;
}

message CreateHouseRequest {
  // Deprecated and ignored: the owner is the calling user (ADR-0004). To be reserved.
  string owner_id = 1 [deprecated = true];
  // 1..200 characters.
  string title = 2;
  // Up to 5000 characters.
  string description = 3;
  Address address = 4;
  ga.common.v1.Money nightly_price = 5;
  // 1..50.
  int32 max_guests = 6;
}

message CreateHouseResponse {
  House house = 1;
}

message GetHouseRequest {
  string id = 1;
}

message GetHouseResponse {
  House house = 1;
}

message ListHousesRequest {
  // 1..100, defaults to 20 when 0.
  int32 page_size = 1;
  string page_token = 2;
  // Only houses of this owner when set.
  optional string owner_id = 3;
  // Only houses in this city (case-insensitive) when set.
  optional string city = 4;
}

message ListHousesResponse {
  repeated House houses = 1;
  string next_page_token = 2;
}

message UpdateHouseRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  // Replaces the whole address when set.
  Address address = 4;
  // Replaces the price when set.
  ga.common.v1.Money nightly_price = 5;
  optional int32 max_guests = 6;
}

message UpdateHouseResponse {
  House house = 1;
}

message DeleteHouseRequest {
  string id = 1;
}

message DeleteHouseResponse {}
