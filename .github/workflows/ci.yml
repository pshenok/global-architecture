name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build, e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://ga:ga@localhost:5432/ga_test
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # buf breaking compares with origin/main

      - uses: actions/setup-node@v5
        with:
          node-version: "26"

      - name: Install pnpm (the repo pins Node and pnpm via devEngines)
        run: npm install --global pnpm@12.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup

      - name: Lint (Biome + oxlint)
        run: pnpm lint
      - run: pnpm typecheck
      - name: Contracts lint
        run: pnpm --filter @ga/contracts lint:proto
      - name: Contracts breaking-change check
        if: github.event_name == 'pull_request'
        working-directory: packages/contracts
        run: pnpm exec buf breaking --against '../../.git#ref=origin/main,subdir=packages/contracts'
      - name: Generated code is up to date
        run: |
          pnpm --filter @ga/contracts codegen
          git diff --exit-code -- packages/contracts

      - run: pnpm test
      - run: pnpm build
      - run: pnpm template:verify

      - name: End to end (PM2 stack)
        run: |
          pnpm stack:up
          pnpm test:e2e
      - name: Stack logs on failure
        if: failure()
        run: tail -n 100 ~/.pm2/logs/*.log || true
