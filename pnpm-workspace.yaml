  "@opentelemetry/sdk-node": 0.300.0
  "@opentelemetry/instrumentation-http": 0.300.0
  "@opentelemetry/instrumentation-grpc": 0.300.0
  "@opentelemetry/instrumentation-pg": 0.77.0
  "@opentelemetry/instrumentation-pino": 0.70.0
  "@fastify/otel": 0.21.3
  import-in-the-middle: 3.5.2
  # codegen
  "@bufbuild/buf": 1.74.0
  ts-proto: 2.18.0
  # tooling
  "@biomejs/biome": 2.6.2
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  turbo: 2.11.10
  typescript: 7.0.2
  "@swc/core": 1.16.18
  "@swc/cli": 0.8.1
  chokidar: 5.0.0
  unplugin-swc: 2.0.0
  vitest: 5.0.5
  vite: 8.3.5
  pm2: 7.1.0
  undici: 8.12.3
  "@types/node": 26.6.5

peerDependencyRules:
  allowedVersions:
    # @fastify/otel 0.21.x still depends on OTel core 2.x, whose peer range stops below api 1.10
    "@opentelemetry/core@2>@opentelemetry/api": "1.10"
